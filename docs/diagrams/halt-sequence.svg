<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="470" fill="#fff"/>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    <rect x="40" y="16" width="160" height="40" rx="8" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="120" y="42">Supervisor</text>
    <rect x="250" y="16" width="160" height="40" rx="8" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="330" y="42">Bridge</text>
    <rect x="460" y="16" width="120" height="40" rx="8" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="520" y="42">Nav2</text>
    <rect x="620" y="16" width="130" height="40" rx="8" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="685" y="42">/cmd_vel</text>
    <rect x="790" y="16" width="110" height="40" rx="8" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="845" y="42">Log</text>
  </g>
  <g stroke="#000" stroke-width="1" stroke-dasharray="5,4">
    <line x1="120" y1="60" x2="120" y2="400"/>
    <line x1="330" y1="60" x2="330" y2="400"/>
    <line x1="520" y1="60" x2="520" y2="400"/>
    <line x1="685" y1="60" x2="685" y2="400"/>
    <line x1="845" y1="60" x2="845" y2="400"/>
  </g>
  <g font-size="13" fill="#000">
    <line x1="120" y1="110" x2="322" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="221" y="100" text-anchor="middle">violation event (record hash)</text>

    <rect x="240" y="135" width="180" height="34" rx="4" fill="#f5f5f5" stroke="#000" stroke-width="1"/>
    <text x="330" y="157" text-anchor="middle">capture robotics state</text>

    <line x1="330" y1="200" x2="512" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="421" y="190" text-anchor="middle">cancel goal (timeout: 20 ms)</text>

    <line x1="330" y1="250" x2="677" y2="250" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="503" y="240" text-anchor="middle">zero-velocity loop (30 × 100 ms = 3 s)</text>

    <rect x="240" y="275" width="180" height="34" rx="4" fill="#f5f5f5" stroke="#000" stroke-width="1"/>
    <text x="330" y="297" text-anchor="middle">assert safe-idle</text>

    <line x1="330" y1="340" x2="837" y2="340" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="583" y="330" text-anchor="middle">append robotics record (chained)</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="470" y="395" text-anchor="middle">outcome: cancel_ok · zero-vel ok/errors · margin_ms vs 50 ms budget · log_ok</text>
    <text x="470" y="415" text-anchor="middle">critical-path budget: 50 ms (steps 1–4)</text>
  </g>
</svg>
