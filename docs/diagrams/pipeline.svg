<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="600" fill="#fff"/>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#000">
    <rect x="370" y="20" width="220" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="480" y="45">mission file (JSON)</text>
    <text x="480" y="64" font-size="12" font-weight="normal" fill="#555">darksand-mission.v1</text>

    <rect x="370" y="110" width="220" height="56" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="480" y="133">compile</text>
    <text x="480" y="152" font-size="12" font-weight="normal" fill="#555">reject unknown fields</text>

    <rect x="350" y="196" width="260" height="72" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="480" y="222">behavior tree</text>
    <text x="480" y="241" font-size="12" font-weight="normal" fill="#555">Sequence · Selector · Parallel · Retry / …</text>

    <rect x="660" y="196" width="220" height="72" rx="8" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="770" y="222">WAL journal (per tick)</text>
    <text x="770" y="241" font-size="12" font-weight="normal" fill="#555">resume from last snapshot</text>

    <rect x="60" y="312" width="220" height="72" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="338">signed policy</text>
    <text x="170" y="357" font-size="12" font-weight="normal" fill="#555">allow / deny per robot mode</text>

    <rect x="350" y="312" width="260" height="72" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="480" y="338">contained executor</text>
    <text x="480" y="357" font-size="12" font-weight="normal" fill="#555">max-ticks · deadline · cancel</text>

    <rect x="660" y="312" width="220" height="72" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="770" y="338">ROS 2 / Nav2</text>
    <text x="770" y="357" font-size="12" font-weight="normal" fill="#555">navigate · /cmd_vel</text>

    <rect x="60" y="420" width="220" height="56" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="453">violation bus</text>

    <rect x="350" y="420" width="260" height="72" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="480" y="446">containment bridge</text>
    <text x="480" y="465" font-size="12" font-weight="normal" fill="#555">cancel · zero-vel · safe-idle · record</text>

    <rect x="660" y="420" width="220" height="56" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="770" y="443">safe-idle gates</text>
    <text x="770" y="462" font-size="12" font-weight="normal" fill="#555">BT + HTTP refuse new work</text>

    <rect x="230" y="524" width="260" height="56" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="360" y="547">receipts</text>
    <text x="360" y="566" font-size="12" font-weight="normal" fill="#555">hash-chained JSONL</text>

    <rect x="560" y="524" width="220" height="56" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="670" y="547">fleet / audit</text>
    <text x="670" y="566" font-size="12" font-weight="normal" fill="#555">verify + summarize + export</text>
  </g>
  <g stroke="#000" stroke-width="1.5" fill="none">
    <line x1="480" y1="80" x2="480" y2="108" marker-end="url(#arr)"/>
    <line x1="480" y1="166" x2="480" y2="194" marker-end="url(#arr)"/>
    <line x1="610" y1="232" x2="658" y2="232" stroke-dasharray="5,4" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <line x1="282" y1="348" x2="348" y2="348" marker-end="url(#arr)"/>
    <line x1="612" y1="348" x2="658" y2="348" marker-end="url(#arr)"/>
    <line x1="480" y1="384" x2="480" y2="418" marker-end="url(#arr)"/>
    <line x1="282" y1="448" x2="348" y2="448" marker-end="url(#arr)"/>
    <line x1="612" y1="448" x2="658" y2="448" marker-end="url(#arr)"/>
    <line x1="480" y1="492" x2="420" y2="522" marker-end="url(#arr)"/>
    <line x1="492" y1="552" x2="558" y2="552" marker-end="url(#arr)"/>
  </g>
</svg>
