[workspace]
members = [
    "crates/darksand-safety",
    "crates/darksand-ros2",
    "crates/darksand-recovery",
    "crates/darksand-fleet",
    "crates/darksand-swarm",
    "crates/darksand-sensors",
    "crates/darksand-simulation",
    "crates/darksand-btree",
    "crates/darksand-policy",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Darksand Contributors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs"] }
tokio-util = "0.7"
futures = "0.3"
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["timeout", "limit", "buffer", "util"] }
rustls = { version = "0.22", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_derive = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "stream"] }
regex = "1.10"
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
async-stream = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
sysinfo = "0.30"
image = "0.25"
rppal = "0.14"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
